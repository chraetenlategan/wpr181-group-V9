<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Counterform Loading</title>

        <link rel="stylesheet" href="css/style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=IBM+Plex+Sans:ital,wdth,wght@0,75..100,100..700;1,75..100,100..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

        <style>

            .skeleton {
                
                display: block;

                background-color: var(--rule-soft);
                background-image: linear-gradient(90deg,
                    var(--rule-soft) 25%,
                    var(--rule) 50%,
                    var(--rule-soft) 75%);
                background-size: 200% 100%;

                border-radius: var(--rad);

                animation: skeleton-shimmer 1.5s infinite linear;
            }

            /* for the shimmer animation */
            @keyframes skeleton-shimmer {
                from { background-position: 200% 0; }
                to   { background-position: -200% 0; }
            }

            .words {
                /* character width */
                width: 9.5ch;
                /* relative to the font size */
                height: 0.9em;
            }

            .navigation {
                height: 0.9em;
            }


            .skeleton--eyebrow {
                width: 26ch;
                height: 0.9em;
            }

            .skeleton--title {
                width: min(6.4em, 100%);
                height: 0.92em; 
            }

            .line {
                width: 100%;
                height: 0.72em;
            }

            .hero {
                display: flex;
                flex-direction: column;
                gap: 0.5em;
            }

            .footer {
                width: 5.9ch;
                height: 0.9em;
            }

            .footer-credit {
                width: 42ch;
                max-width: 45vw;
                height: 0.9em;
            }

            /* reduce animation */
            @media (prefers-reduced-motion: reduce) {
                .skeleton {
                    animation: none;
                }
            }
        </style>
    </head>

    <body>
        <div class="page">
            <header class="header">
                <span class="header__wordmark">
                    <span class="skeleton words"></span>
                </span>

                <nav class="header__navbar">
                    <span class="header__navbar-link"><span class="skeleton navigation"></span></span>
                    <span class="header__navbar-link"><span class="skeleton navigation"></span></span>
                    <span class="header__navbar-link"><span class="skeleton navigation"></span></span>
                    <span class="header__navbar-link"><span class="skeleton navigation"></span></span>
                </nav>
            </header>

            <main class="page__content">
                <section class="section" id="section-hero">
                    <div class="hero">
                        <p class="eyebrow">
                            <span class="skeleton skeleton--eyebrow"></span>
                        </p>

                        <h1 class="hero__title">
                            <span class="skeleton skeleton--title"></span>
                        </h1>

                        <p class="hero__tagline hero">
                            <span class="skeleton line"></span>
                            <span class="skeleton line"></span>
                            <span class="skeleton line"></span>
                        </p>
                    </div>
                </section>
            </main>

            <footer class="footer">
                <span class="footer__index">
                    <span class="skeleton footer"></span>
                </span>

                <span class="footer__credit">
                    <span class="skeleton footer-credit"></span>
                </span>
            </footer>
        </div>

        <canvas id="canvas"></canvas>
    </body>
</html>
